name: Continuous Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # <- enforce bash everywhere

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: zip
          - os: macos-13
            archive: zip
          - os: ubuntu-latest
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyInstaller + PyQt6
        run: |
          python -m pip install --upgrade pip wheel
          pip install pyinstaller pyqt6

      - name: Install Qt runtime deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xtest0 libxkbcommon-x11-0

      - name: Show versions
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
          python -c "from PyQt6.QtCore import QT_VERSION_STR; print('PyQt6 (Qt) version:', QT_VERSION_STR)"

      - name: Build with PyInstaller
        run: |
          if [ -f translations.spec ]; then
            pyinstaller --noconfirm --clean translations.spec
          else
            pyinstaller --noconfirm --clean \
              --name translations \
              --onefile --windowed \
              --collect-all PyQt6 \
              translations.py
          fi

      # ------------ Packaging ------------
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          7z a translations-Windows.zip dist/translations.exe

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          if [ -d dist/translations.app ]; then
            (cd dist && ditto -c -k --sequesterRsrc --keepParent translations.app ../translations-macOS.zip)
          else
            (cd dist && zip -r ../translations-macOS.zip translations)
          fi

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf translations-Linux.tar.gz -C dist translations

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifact
          path: |
            *.zip
            *.tar.gz

  release:
    name: Update Continuous Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all archived builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: continuous
          commit: ${{ github.sha }}
          name: "Continuous Auto-Build"
          body: "Auto-built from ${{ github.ref }} @ ${{ github.sha }}"
          artifacts: "artifacts/*"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
